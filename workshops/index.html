<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الورشات - عقلية قيد التحديث</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
  <style>
    .carousel-indicators [data-bs-target] {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #6c757d;
      color: white;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .carousel-indicators {
      position: static;
      margin-top: 15px;
    }
  </style>
</head>
<body>

<div class="container my-5">
  <h1 class="text-center mb-4">الورشات التدريبية</h1>

  <div id="workshopsCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="8000">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="/assets/img/workshops/1.png" class="d-block w-100" alt="ورشة 1">
      </div>
      <div class="carousel-item">
        <img src="/assets/img/workshops/2.png" class="d-block w-100" alt="ورشة 2">
      </div>
      <div class="carousel-item">
        <img src="/assets/img/workshops/3.png" class="d-block w-100" alt="ورشة 3">
      </div>
      <div class="carousel-item">
        <img src="/assets/img/workshops/4.png" class="d-block w-100" alt="ورشة 4">
      </div>
    </div>

    <!-- Indicators (الأرقام) -->
    <div class="carousel-indicators justify-content-center">
      <button type="button" data-bs-target="#workshopsCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="1">1</button>
      <button type="button" data-bs-target="#workshopsCarousel" data-bs-slide-to="1" aria-label="2">2</button>
      <button type="button" data-bs-target="#workshopsCarousel" data-bs-slide-to="2" aria-label="3">3</button>
      <button type="button" data-bs-target="#workshopsCarousel" data-bs-slide-to="3" aria-label="4">4</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
