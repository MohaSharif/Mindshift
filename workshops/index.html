<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الورشات - عقلية قيد التحديث</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" />
  <style>
    body {
      background-color: #121212;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
    }
    nav a {
      color: white;
      margin-left: 15px;
      text-decoration: none;
      font-weight: bold;
    }
    .carousel-inner img {
      max-width: 600px;
      height: auto;
      margin: 0 auto;
      border-radius: 10px;
    }
    .carousel-indicators [data-bs-target] {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #bbb;
    }
    .carousel-indicators .active {
      background-color: #fff;
    }
  </style>
</head>
<body>

<header class="py-3 border-bottom bg-dark">
  <div class="container d-flex flex-wrap justify-content-center">
    <nav class="nav nav-pills">
      <a class="nav-link" href="/Mindshift/">الرئيسية</a>
      <a class="nav-link" href="/Mindshift/book/">الكتاب</a>
      <a class="nav-link" href="/Mindshift/author/">المؤلف</a>
      <a class="nav-link active" href="/Mindshift/workshops/">الورشات</a>
    </nav>
  </div>
</header>

<div class="container text-center py-5">
  <h1 class="mb-4">الورشات التدريبية</h1>

  <div id="workshopsCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="8000">
    <div class="carousel-inner">
      <div class="carousel-item text-center active">
        <img src="/Mindshift/assets/img/workshops/1.png" class="d-block mx-auto mb-2" style="max-width: 600px; height: auto;" alt="ورشة 1" />
        <button class="btn btn-outline-light btn-sm" disabled>طالع التفاصيل ⏷</button>
      </div>
      <div class="carousel-item text-center">
        <img src="/Mindshift/assets/img/workshops/2.png" class="d-block mx-auto mb-2" style="max-width: 600px; height: auto;" alt="ورشة 2" />
        <button class="btn btn-outline-light btn-sm" disabled>طالع التفاصيل ⏷</button>
      </div>
      <div class="carousel-item text-center">
        <img src="/Mindshift/assets/img/workshops/3.png" class="d-block mx-auto mb-2" style="max-width: 600px; height: auto;" alt="ورشة 3" />
        <button class="btn btn-outline-light btn-sm" disabled>طالع التفاصيل ⏷</button>
      </div>
      <div class="carousel-item text-center">
        <img src="/Mindshift/assets/img/workshops/4.png" class="d-block mx-auto mb-2" style="max-width: 600px; height: auto;" alt="ورشة 4" />
        <button class="btn btn-outline-light btn-sm" disabled>طالع التفاصيل ⏷</button>
      </div>
    </div>
    <div class="carousel-indicators mt-3">
      <button type="button" data-bs-target="#workshopsCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="1"></button>
      <button type="button" data-bs-target="#workshopsCarousel" data-bs-slide-to="1" aria-label="2"></button>
      <button type="button" data-bs-target="#workshopsCarousel" data-bs-slide-to="2" aria-label="3"></button>
      <button type="button" data-bs-target="#workshopsCarousel" data-bs-slide-to="3" aria-label="4"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
